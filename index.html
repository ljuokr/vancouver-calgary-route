<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vancouver → Calgary · Roadtrip</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --lake:#0e5a6d;        /* Gletscher-Tiefblau (Rockies) */
    --lake-dark:#083c49;
    --paper:#fbf8f2;
    --ink:#20242a;
    --route:#55606b;       /* Routenlinie (Trans-Canada) */
    --must:#c8472e;        /* Highlight-Signalrot */
    --wandern:#3e7d3a;     /* Wander-Grün */
    --paddeln:#0e7c86;     /* Wasser-Petrol */
    --aussicht:#46628c;    /* Berg-Stahlblau */
    --therme:#c2417f;      /* Thermen-Magenta */
    --stopp:#6b5b95;       /* Stopp-Violett */
    --rnd:#b07c10;         /* Kurioses-Bernstein */
    --radius:16px;
    --shadow:0 6px 24px rgba(8,60,73,.18);
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);
  }
  #map{position:fixed;inset:0;z-index:1;background:#dce9ec}

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(var(--sat) + 10px) 14px 0;
    pointer-events:none;
  }
  .title-card{
    pointer-events:auto;
    background:var(--lake);color:#fff;
    border-radius:var(--radius);
    padding:12px 16px 10px;
    box-shadow:var(--shadow);
  }
  .title-card h1{
    font-size:1.05rem;font-weight:700;letter-spacing:.01em;line-height:1.2;
  }
  .title-card p{
    font-size:.72rem;opacity:.85;margin-top:2px;
  }
  /* Filter chips */
  .chips{
    pointer-events:auto;
    display:flex;gap:8px;margin-top:10px;
    overflow-x:auto;scrollbar-width:none;
    padding-bottom:4px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    border:none;border-radius:999px;
    padding:9px 14px;font-size:.82rem;font-weight:600;
    background:#fff;color:var(--ink);
    box-shadow:0 2px 10px rgba(8,60,73,.14);
    cursor:pointer;transition:transform .12s ease,opacity .15s ease;
  }
  .chip:active{transform:scale(.95)}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip[data-cat="must"] .dot{background:var(--must)}
  .chip[data-cat="wandern"] .dot{background:var(--wandern)}
  .chip[data-cat="paddeln"] .dot{background:var(--paddeln)}
  .chip[data-cat="aussicht"] .dot{background:var(--aussicht)}
  .chip[data-cat="therme"] .dot{background:var(--therme)}
  .chip[data-cat="stopp"] .dot{background:var(--stopp)}
  .chip[data-cat="rnd"] .dot{background:var(--rnd)}
  .chip[data-cat="all"] .dot{background:conic-gradient(var(--must) 0 14.3%,var(--wandern) 14.3% 28.6%,var(--paddeln) 28.6% 42.9%,var(--aussicht) 42.9% 57.1%,var(--therme) 57.1% 71.4%,var(--stopp) 71.4% 85.7%,var(--rnd) 85.7% 100%)}
  .chip.off{opacity:.45}
  .chip.off .dot{background:#9aa3ab !important}

  /* ---------- Marker ---------- */
  .pin{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50% 50% 50% 6px;
    transform:rotate(0deg);
    font-size:19px;line-height:1;
    border:2.5px solid #fff;
    box-shadow:0 3px 10px rgba(8,60,73,.35);
  }
  .pin.must{background:var(--must)}
  .pin.wandern{background:var(--wandern)}
  .pin.paddeln{background:var(--paddeln)}
  .pin.aussicht{background:var(--aussicht)}
  .pin.therme{background:var(--therme)}
  .pin.stopp{background:var(--stopp)}
  .pin.rnd{background:var(--rnd)}

  /* ---------- Bottom Sheet ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -8px 32px rgba(8,60,73,.22);
    padding:10px 20px calc(var(--sab) + 20px);
    transform:translateY(110%);
    transition:transform .28s cubic-bezier(.32,.72,.3,1);
    max-height:55vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .grabber{width:40px;height:4px;border-radius:2px;background:#d5dade;margin:0 auto 12px}
  .sheet .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px;
  }
  .sheet .tag.must{background:var(--must)}
  .sheet .tag.wandern{background:var(--wandern)}
  .sheet .tag.paddeln{background:var(--paddeln)}
  .sheet .tag.aussicht{background:var(--aussicht)}
  .sheet .tag.therme{background:var(--therme)}
  .sheet .tag.stopp{background:var(--stopp)}
  .sheet .tag.rnd{background:var(--rnd)}
  .sheet h2{font-size:1.25rem;font-weight:800;line-height:1.25;margin-bottom:6px}
  .sheet .note{font-size:.92rem;line-height:1.55;color:#454c53}
  .sheet .meta{font-size:.8rem;color:#79828a;margin-top:10px}
  .sheet a.route{
    display:inline-block;margin-top:14px;
    background:var(--lake);color:#fff;text-decoration:none;
    font-size:.88rem;font-weight:700;
    padding:11px 18px;border-radius:12px;
  }
  .sheet a.route:active{background:var(--lake-dark)}

  /* ---------- Eigener Standort ---------- */
  .me-dot{
    width:18px;height:18px;border-radius:50%;
    background:#1a73e8;border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 8px rgba(8,60,73,.3);
  }
  .me-pulse{animation:pulse 2s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 0 rgba(26,115,232,.45)}
    70%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 18px rgba(26,115,232,0)}
    100%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 0 rgba(26,115,232,0)}
  }
  @media (prefers-reduced-motion:reduce){.me-pulse{animation:none}}
  .locate-btn{
    position:fixed;right:14px;bottom:calc(var(--sab) + 24px);z-index:25;
    width:52px;height:52px;border-radius:50%;border:none;
    background:#fff;color:var(--lake);font-size:22px;
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .locate-btn:active{transform:scale(.92)}
  .locate-btn.active{background:var(--lake);color:#fff}

  /* Leaflet Bedienelemente unter die Chips schieben */
  .leaflet-top{top:calc(var(--sat) + 118px)}
  .leaflet-control-attribution{font-size:9px}

  /* ---------- Desktop-Anpassung (mobile first, dann hoch) ---------- */
  @media (min-width:760px){
    header{left:20px;right:auto;width:380px}
    .sheet{left:20px;right:auto;width:380px;border-radius:22px;bottom:20px;max-height:50vh}
    .leaflet-top{top:20px}
    .leaflet-left{left:auto;right:10px}
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="title-card">
    <h1>Vancouver → Calgary: Roadtrip durch die Rockies</h1>
    <p>2 Varianten: Coquihalla &amp; Sea-to-Sky (Whistler) · antippen für Details</p>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-cat="all"><span class="dot"></span>Alle</button>
    <button class="chip" data-cat="must"><span class="dot"></span>⭐ Highlights</button>
    <button class="chip" data-cat="wandern"><span class="dot"></span>🥾 Wandern</button>
    <button class="chip" data-cat="paddeln"><span class="dot"></span>🛶 Paddeln</button>
    <button class="chip" data-cat="aussicht"><span class="dot"></span>🏔️ Aussicht</button>
    <button class="chip" data-cat="therme"><span class="dot"></span>♨️ Thermen</button>
    <button class="chip" data-cat="stopp"><span class="dot"></span>🏙️ Stopps</button>
    <button class="chip" data-cat="rnd"><span class="dot"></span>🎲 Kurioses</button>
  </div>
</header>

<button class="locate-btn" id="locateBtn" aria-label="Meinen Standort anzeigen" title="Mein Standort">➤</button>

<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <span class="tag" id="sheetTag"></span>
  <h2 id="sheetTitle"></h2>
  <p class="note" id="sheetNote"></p>
  <p class="meta" id="sheetMeta"></p>
  <a class="route" id="sheetRoute" target="_blank" rel="noopener">Route in Google Maps</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CATS = {
  must:     {label:"Highlight",       emoji:"⭐"},
  wandern:  {label:"Wandern",         emoji:"🥾"},
  paddeln:  {label:"Paddeln",         emoji:"🛶"},
  aussicht: {label:"Aussicht & Pass", emoji:"🏔️"},
  therme:   {label:"Therme",          emoji:"♨️"},
  stopp:    {label:"Stopp & Stadt",   emoji:"🏙️"},
  rnd:      {label:"Kurioses",        emoji:"🎲"}
};

const PLACES = [
  // ---------- Highlights ----------
  {cat:"must", name:"Lake Louise", lat:51.4171, lng:-116.2179,
   note:"Der türkise Klassiker der Rockies vor dem Victoria-Gletscher, hinter dem Fairmont-Chateau. Früh dran sein: der Parkplatz ist im Sommer oft schon am Morgen voll (Shuttle nutzen). Kanuverleih am Ufer.",
   meta:"Banff NP · Parken früh oder Parks-Canada-Shuttle"},
  {cat:"must", name:"Moraine Lake", lat:51.3217, lng:-116.1860,
   note:"Das Motiv vom alten 20-Dollar-Schein: tiefblauer See im Valley of the Ten Peaks. Privatautos sind gesperrt, Zufahrt nur mit Shuttle oder Rovers. Zum Sonnenaufgang am schönsten.",
   meta:"Banff NP · nur per Shuttle erreichbar"},
  {cat:"must", name:"Peyto Lake", lat:51.7169, lng:-116.5265,
   note:"Fuchskopfförmiger Gletschersee in leuchtendem Türkis, kurzer Weg zum Aussichtsdeck. Liegt am Icefields Parkway, ca. 40 Min. nördlich von Lake Louise (Abstecher).",
   meta:"Icefields Pkwy · Abstecher ab Lake Louise"},
  {cat:"must", name:"Takakkaw Falls", lat:51.4996, lng:-116.4757,
   note:"Mit 254 m einer der höchsten Wasserfälle Kanadas, gespeist vom Daly-Gletscher. Die Zufahrtsstrasse hat enge Spitzkehren (keine grossen Wohnmobile), im Sommer geöffnet.",
   meta:"Yoho NP · Strasse Ende Juni bis Okt"},
  {cat:"must", name:"Bow Falls", lat:51.167410, lng:-115.560901,
   note:"Breiter Wasserfall am Bow River am Rand von Banff, kurzer Spaziergang vom Ort oder vom Fairmont Banff Springs. Gut mit Surprise Corner zu verbinden.",
   meta:"Banff · frei zugänglich"},
  {cat:"must", name:"Banff Avenue", lat:51.180120, lng:-115.569612,
   note:"Die Hauptstrasse des Bergstädtchens Banff mit Bergkulisse am Ende: Cafés, Outdoor-Läden und Ausgangspunkt für alles. Voll, aber der klassische Basislager-Stopp.",
   meta:"Banff Townsite"},
  {cat:"must", name:"Cave and Basin", lat:51.1710, lng:-115.5905,
   note:"Die heisse Quelle, an der 1885 der Banff-Nationalpark - Kanadas erster - begann. Historische Badehalle und Höhle, heute Museum (kein Baden). Regnerischer-Tag-Tipp.",
   meta:"Banff · Eintritt, National Historic Site"},

  // ---------- Wandern ----------
  {cat:"wandern", name:"Lake Agnes Tea House", lat:51.4287, lng:-116.2308,
   note:"Beliebteste Wanderung ab Lake Louise: gut 3,5 km bergauf zu einem See mit historischem Teehaus (seit 1905, nur Bargeld). Weiter zum Big Beehive für den Rundblick.",
   meta:"ca. 7 km retour · +400 hm"},
  {cat:"wandern", name:"Plain of Six Glaciers", lat:51.4030, lng:-116.2670,
   note:"Wanderung am Ufer von Lake Louise entlang bis unter den Victoria-Gletscher, zweites Teehaus am Weg. Lässt sich mit Lake Agnes zur grossen Runde verbinden.",
   meta:"ca. 14 km retour · +365 hm"},
  {cat:"wandern", name:"Johnston Canyon", lat:51.2453, lng:-115.8407,
   note:"Stege durch eine enge Schlucht zu Lower und Upper Falls, weiter zu den Ink Pots. Sehr beliebt, darum früh oder abends gehen. Zwischen Banff und Lake Louise am Bow Valley Parkway.",
   meta:"Lower Falls 2,4 km · Ink Pots 12 km retour"},
  {cat:"wandern", name:"Larch Valley & Sentinel Pass", lat:51.3280, lng:-116.1870,
   note:"Ab Moraine Lake ins Lärchental, im September golden gefärbt, hinauf zum Sentinel Pass. Bei Bärenaktivität gilt oft Gruppenpflicht (min. 4 Personen).",
   meta:"Larch Valley 8,6 km · Pass 11,6 km retour"},
  {cat:"wandern", name:"Tunnel Mountain", lat:51.176892, lng:-115.561557,
   note:"Kurzer Gipfel direkt über Banff mit Blick über Ort und Bow Valley. Guter Einlaufweg am Ankunftstag, in gut einer Stunde oben.",
   meta:"4,6 km retour · +260 hm"},
  {cat:"wandern", name:"Grassi Lakes", lat:51.081324, lng:-115.395050,
   note:"Familientaugliche Wanderung bei Canmore zu zwei knallgrünen Bergseen, oben Kletterfelsen und ein kleiner Wasserfall. Leichte oder etwas steilere Route wählbar.",
   meta:"Canmore · ca. 4 km retour"},
  {cat:"wandern", name:"Wapta Falls", lat:51.1725, lng:-116.5605,
   note:"Breitester Wasserfall des Kicking Horse River, einfacher Waldweg im südlichen Yoho. Wenig überlaufen, guter Beine-vertreten-Stopp Richtung Golden.",
   meta:"Yoho NP · 4,6 km retour, flach"},
  {cat:"wandern", name:"Giant Cedars Boardwalk", lat:51.0435, lng:-118.1360,
   note:"Kurzer Rundsteg durch uralten Zedern-Regenwald im Mount-Revelstoke-Park, direkt an der Trans-Canada. Perfekt zum Aussteigen und Durchatmen.",
   meta:"Mt Revelstoke NP · 0,5 km Rundweg"},

  // ---------- Paddeln ----------
  {cat:"paddeln", name:"Emerald Lake", lat:51.4429, lng:-116.5289,
   note:"Smaragdgrüner See in Yoho, ruhiger als Lake Louise. Kanuverleih an der Lodge, dazu ein flacher Rundweg ums Ufer. Auf dem Weg der berühmte Natural Bridge.",
   meta:"Yoho NP · Kanuverleih an der Lodge"},
  {cat:"paddeln", name:"Vermilion Lakes", lat:51.184337, lng:-115.590649,
   note:"Flache Seenkette am Rand von Banff mit Traumblick auf den Mount Rundle. Ideal für Kanu oder SUP im Morgenlicht, oft Wildtiere am Ufer.",

  {cat:"paddeln", name:"Two Jack Lake", lat:51.2258, lng:-115.4772,

  {cat:"paddeln", name:"Lake Minnewanka", lat:51.2530, lng:-115.4110,
   note:"Grösster See im Banff-Park, gut 20 km lang. Kajak, Bootstour oder nur die Uferpromenade. Sturmböen möglich, darum Wetter beachten.",
   meta:"Banff · Verleih und Bootscruise vor Ort"},
  {cat:"paddeln", name:"Bow River (Canmore)", lat:51.089703, lng:-115.370507,
   note:"Gemächliche Flusspassagen und Stillwasser rund um Canmore, dazu Verleih für Kanu, SUP und Floss. Blick auf die Three Sisters.",
   meta:"Canmore · Einstiege am Bow River"},

  // ---------- Aussicht & Pässe ----------
  {cat:"aussicht", name:"Rogers Pass", lat:51.301314, lng:-117.521161,
   note:"Höhepunkt der Fahrt durch den Glacier-Nationalpark (1330 m), berüchtigt für Lawinen und die langen Schneegalerien. Discovery Centre mit Café und Ausstellung.",
   meta:"Glacier NP · Discovery Centre am Pass"},
  {cat:"aussicht", name:"Kicking Horse Pass", lat:51.4472, lng:-116.3130,
   note:"Kontinentale Wasserscheide und Provinzgrenze BC/Alberta auf 1627 m. Hier trennen sich die Flüsse Richtung Pazifik und Atlantik.",
   meta:"Grenze BC/Alberta, Trans-Canada"},
  {cat:"aussicht", name:"Banff Gondola (Sulphur Mtn)", lat:51.147902, lng:-115.555447,
   note:"Gondel auf den Sulphur Mountain (2281 m): Rundum-Panorama über sechs Bergketten, Stege am Grat, Restaurant oben. Alternativ zu Fuss hoch.",
   meta:"Banff · Gondel kostenpflichtig"},
  {cat:"aussicht", name:"Lake Louise Gondola", lat:51.4443, lng:-116.1580,
   note:"Sessel- oder Gondelbahn am Skigebiet gegenüber von Lake Louise: Blick über den See und die Gletscher, gute Chance auf Grizzly-Sichtung am Hang.",
   meta:"Lake Louise · Sommerbetrieb"},
  {cat:"aussicht", name:"Surprise Corner", lat:51.167623, lng:-115.559828,
   note:"Der Postkarten-Aussichtspunkt auf das Fairmont Banff Springs Hotel über dem Bow River. Startpunkt des kurzen Wegs zu den Hoodoos.",
   meta:"Banff · Parkplatz Buffalo St"},
  {cat:"aussicht", name:"Meadows in the Sky Parkway", lat:51.0230, lng:-118.1930,
   note:"26 km Panoramastrasse den Mount Revelstoke hinauf bis fast zum Gipfel, oben im Sommer Bergwiesen voller Blumen. Letzte Kehren per Shuttle.",
   meta:"Mt Revelstoke NP · Strasse ab Juli offen"},
  {cat:"aussicht", name:"Hoodoos Viewpoint", lat:51.1873, lng:-115.5330,
   note:"Aussicht über die bizarren Erd-Säulen (Hoodoos) und das Bow Valley am Rand von Banff. Kurzer Uferweg vom Ort her.",
   meta:"Banff · frei zugänglich"},

  // ---------- Thermen ----------
  {cat:"therme", name:"Banff Upper Hot Springs", lat:51.150864, lng:-115.560598,
   note:"Historisches Thermalbad auf 1585 m mit dampfendem Aussenbecken und Bergblick. Nach einem Wandertag ideal, abends am ruhigsten. Badesachen mietbar.",
   meta:"Banff · ganzjährig, Eintritt"},
  {cat:"therme", name:"Radium Hot Springs", lat:50.620073, lng:-116.076059,
   note:"Grosses, mineralreiches Thermalbecken am Tor zum Kootenay-Park. Liegt südlich der Route (Abstecher über Hwy 93), lohnt als Schlenker oder eigener Tag.",
   meta:"Kootenay NP · Abstecher ab Banff/Golden"},
  {cat:"therme", name:"Canyon Hot Springs", lat:51.136817, lng:-117.858688,
   note:"Thermalbecken mit Campground direkt an der Trans-Canada zwischen Revelstoke und Rogers Pass. Praktischer Zwischenstopp, nur im Sommer offen.",
   meta:"Albert Canyon · Becken Mai bis Sep"},

  // ---------- Stopps & Städte ----------
  {cat:"stopp", name:"Hope", lat:49.379978, lng:-121.441585,
   note:"Erster grösserer Halt raus aus dem Grossraum Vancouver, bekannt für Kettensägen-Schnitzereien und als Drehort von „Rambo“. Tanken und Kaffee vor der Bergstrecke.",
   meta:"BC · ca. 1,5 Std. ab Vancouver"},
  {cat:"stopp", name:"Kamloops", lat:50.675827, lng:-120.339415,
   note:"Trockene, sonnige Stadt am Zusammenfluss zweier Flüsse, typischer erster Übernachtungsstopp. Halbwüstenlandschaft, gutes Angebot an Motels und Diners.",
   meta:"BC · ca. 3,5 Std. ab Vancouver"},
  {cat:"stopp", name:"Revelstoke", lat:50.998045, lng:-118.195671,
   note:"Charmantes Bergstädtchen zwischen Monashee- und Selkirk-Bergen: hübsche Innenstadt, Eisenbahnmuseum, gute Brauereien. Beliebter zweiter Übernachtungsstopp.",
   meta:"BC · Tor zu Glacier NP"},
  {cat:"stopp", name:"Golden", lat:51.299222, lng:-116.964296,

  {cat:"stopp", name:"Field", lat:51.396111, lng:-116.489153,
   note:"Winziges Bahn-Dorf mitten im Yoho-Park, Ausgangspunkt für Emerald Lake und die Burgess-Shale-Fossilien. Wenige Gästehäuser, sehr ruhig.",
   meta:"BC · Yoho National Park"},
  {cat:"stopp", name:"Lake Louise Village", lat:51.425171, lng:-116.178946,
   note:"Kleiner Versorgungsort (Samson Mall) unterhalb des Sees: Bäckerei, Tankstelle, Shuttle-Haltestellen. Praktische Basis, um früh am See zu sein.",

  {cat:"stopp", name:"Canmore", lat:51.086690, lng:-115.348113,
   note:"Entspanntere Alternative zu Banff direkt vor dem Parktor: Blick auf die Three Sisters, gute Restaurants und günstiger übernachten. Letzter Bergstopp vor Calgary.",
   meta:"Alberta · ca. 1 Std. vor Calgary"},

  // ---------- Kurioses ----------
  {cat:"rnd", name:"Last Spike (Craigellachie)", lat:50.9700, lng:-118.7220,
   note:"Hier wurde 1885 der letzte Nagel der ersten transkontinentalen Eisenbahn Kanadas eingeschlagen. Kleine Gedenkstätte mit Souvenirladen direkt an der Strasse.",
   meta:"Craigellachie, BC · frei"},
  {cat:"rnd", name:"The Enchanted Forest", lat:50.972155, lng:-118.565541,
   note:"Skurriler Märchenwald von 1960: über 350 handgemachte Figuren und das höchste Baumhaus in BC, mitten im Wald an der Trans-Canada. Herrlich altmodisch.",
   meta:"bei Revelstoke · Mai bis Sep, Eintritt"},
  {cat:"rnd", name:"Three Valley Gap", lat:50.933828, lng:-118.445762,
   note:"Knallrotes Chateau an einem Bergsee plus rekonstruiertes Geister-Städtchen mit über 25 historischen Gebäuden. Kitschig-kurioser Fotostopp westlich von Revelstoke.",
   meta:"bei Revelstoke · Ghost Town saisonal"},
  {cat:"rnd", name:"Spiral Tunnels", lat:51.4448, lng:-116.3120,
   note:"Aussichtspunkt auf die berühmten Kehrtunnel: bei Glück verschwindet ein langer Güterzug vorne im Berg, während sein Ende noch aus einem anderen Tunnel kommt.",
   meta:"Yoho NP · Viewpoint an der Trans-Canada"},
  {cat:"rnd", name:"Natural Bridge (Yoho)", lat:51.3877, lng:-116.5253,
   note:"Der Kicking Horse River hat sich hier eine Felsbrücke durch den Stein gefräst. Kurzer Halt auf dem Weg zum Emerald Lake.",
   meta:"Yoho NP · frei zugänglich"},
  {cat:"rnd", name:"Kicking Horse Pedestrian Bridge", lat:51.299674, lng:-116.968339,
   note:"Längste freitragende Holzrahmen-Brücke Kanadas, über den Kicking Horse River in Golden. Netter Abstecher in die Innenstadt.",

// ---------- Karte ----------
const map = L.map('map', {zoomControl:true}).setView([50.7, -118.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

// Routenlinie entlang der Trans-Canada / Coquihalla (Vancouver -> Calgary)
const ROUTE = [
  [49.2827,-123.1207], // Vancouver
  [49.3800,-121.4416], // Hope
  [50.1113,-120.7862], // Merritt (Coquihalla)
  [50.6758,-120.3394], // Kamloops
  [50.7001,-119.2838], // Salmon Arm
  [50.9980,-118.1957], // Revelstoke
  [51.3013,-117.5212], // Rogers Pass
  [51.2992,-116.9643], // Golden
  [51.3961,-116.4892], // Field
  [51.4252,-116.1789], // Lake Louise
  [51.1801,-115.5696], // Banff
  [51.0867,-115.3481], // Canmore
  [51.0447,-114.0719]  // Calgary
];
const ROUTE_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--route').trim() || '#55606b';
const routeLine = L.polyline(ROUTE, {
  color:ROUTE_COLOR, weight:4, opacity:.85, dashArray:'2 9', lineCap:'round'
}).addTo(map).bindTooltip('Standard: über Hope & Coquihalla', {sticky:true});

// Variante über Whistler (Sea-to-Sky Hwy 99 + Duffey Lake Rd), trifft bei Kamloops wieder auf die Hauptroute
const ROUTE_WHISTLER = [
  [49.2827,-123.1207], // Vancouver
  [49.6981,-123.1559], // Squamish
  [50.1147,-122.9560], // Whistler
  [50.3204,-122.8081], // Pemberton
  [50.3474,-122.4772], // Joffre Lakes
  [50.4052,-122.3122], // Duffey Lake
  [50.6939,-121.9337], // Lillooet
  [50.8132,-121.3242], // Cache Creek
  [50.6758,-120.3394]  // Kamloops (zurück auf die Hauptroute)
];
const routeLineWhistler = L.polyline(ROUTE_WHISTLER, {
  color:ROUTE_COLOR, weight:4, opacity:.85, dashArray:'11 8', lineCap:'round'
}).addTo(map).bindTooltip('Variante: Sea-to-Sky über Whistler', {sticky:true});

// Start-/Zielpunkte markieren
[['Vancouver',ROUTE[0]],['Calgary',ROUTE[ROUTE.length-1]]].forEach(([n,ll]) => {
  L.marker(ll, {icon:L.divIcon({className:'', html:`<div class="pin" style="background:var(--lake)">${n==='Vancouver'?'🏁':'🎯'}</div>`, iconSize:[38,38], iconAnchor:[19,36]})})
    .addTo(map).bindTooltip(n, {direction:'top', offset:[0,-34]});
});
map.fitBounds(L.featureGroup([routeLine, routeLineWhistler]).getBounds(), {padding:[50,50]});

const markers = [];
PLACES.forEach(p => {
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin ${p.cat}">${CATS[p.cat].emoji}</div>`,
    iconSize:[38,38], iconAnchor:[19,36]
  });
  const m = L.marker([p.lat, p.lng], {icon}).addTo(map);
  m.on('click', () => openSheet(p));
  m._cat = p.cat;
  markers.push(m);
});

// ---------- Bottom Sheet ----------
const sheet = document.getElementById('sheet');
function openSheet(p){
  document.getElementById('sheetTag').textContent = CATS[p.cat].emoji + ' ' + CATS[p.cat].label;
  document.getElementById('sheetTag').className = 'tag ' + p.cat;
  document.getElementById('sheetTitle').textContent = p.name;
  document.getElementById('sheetNote').textContent = p.note;
  document.getElementById('sheetMeta').textContent = p.meta || '';
  document.getElementById('sheetRoute').href =
    'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng;
  sheet.classList.add('open');
  map.panTo([p.lat, p.lng], {animate:true});
}
map.on('click', () => sheet.classList.remove('open'));

// Swipe nach unten schliesst das Sheet
let startY = null;
sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if(startY !== null && e.touches[0].clientY - startY > 60){
    sheet.classList.remove('open'); startY = null;
  }
}, {passive:true});

// ---------- Filter ----------
const state = {};
Object.keys(CATS).forEach(k => state[k] = true);
const allOn = () => Object.keys(CATS).every(k => state[k]);
function applyFilter(){
  markers.forEach(m => {
    if(state[m._cat]) m.addTo(map); else map.removeLayer(m);
  });
  document.querySelectorAll('.chip').forEach(c => {
    const cat = c.dataset.cat;
    if(cat === 'all'){
      c.classList.toggle('off', !allOn());
    } else {
      c.classList.toggle('off', !state[cat]);
    }
  });
}
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const cat = chip.dataset.cat;
  if(cat === 'all'){
    Object.keys(CATS).forEach(k => state[k] = true);
  } else {
    // Wenn aktuell alle an sind: nur diese Kategorie zeigen
    if(allOn()){
      Object.keys(CATS).forEach(k => state[k] = false);
      state[cat] = true;
    } else {
      state[cat] = !state[cat];
      if(Object.keys(CATS).every(k => !state[k])){
        Object.keys(CATS).forEach(k => state[k] = true);
      }
    }
  }
  applyFilter();
  sheet.classList.remove('open');
});
applyFilter();

// ---------- Eigener Standort ----------
const locateBtn = document.getElementById('locateBtn');
let watchId = null, meMarker = null, meCircle = null, firstFix = true;

const meIcon = L.divIcon({
  className:'',
  html:'<div class="me-dot me-pulse"></div>',
  iconSize:[18,18], iconAnchor:[9,9]
});

function onFix(pos){
  const ll = [pos.coords.latitude, pos.coords.longitude];
  if(!meMarker){
    meMarker = L.marker(ll, {icon:meIcon, zIndexOffset:1000, interactive:false}).addTo(map);
    meCircle = L.circle(ll, {
      radius:pos.coords.accuracy,
      color:'#1a73e8', weight:1, opacity:.4,
      fillColor:'#1a73e8', fillOpacity:.1, interactive:false
    }).addTo(map);
  } else {
    meMarker.setLatLng(ll);
    meCircle.setLatLng(ll).setRadius(pos.coords.accuracy);
  }
  if(firstFix){
    map.setView(ll, Math.max(map.getZoom(), 14), {animate:true});
    firstFix = false;
  }
}

function onErr(err){
  stopLocate();
  alert('Standort nicht verfügbar. Bitte Ortungsdienste erlauben (funktioniert nur über HTTPS).');
}

function startLocate(){
  if(!('geolocation' in navigator)){ alert('Dieses Gerät unterstützt keine Ortung.'); return; }
  firstFix = true;
  watchId = navigator.geolocation.watchPosition(onFix, onErr, {
    enableHighAccuracy:true, maximumAge:10000, timeout:15000
  });
  locateBtn.classList.add('active');
}

function stopLocate(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(meMarker){ map.removeLayer(meMarker); meMarker = null; }
  if(meCircle){ map.removeLayer(meCircle); meCircle = null; }
  locateBtn.classList.remove('active');
}

locateBtn.addEventListener('click', () => {
  if(watchId !== null){
    if(meMarker) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 15), {animate:true});
    else stopLocate();
  } else {
    startLocate();
  }
});
locateBtn.addEventListener('dblclick', stopLocate);

// Bei einer Routenkarte NICHT automatisch orten (sonst springt die Ansicht
// weg von der Strecke). Der Standort-Button bleibt für unterwegs nutzbar.
</script>
